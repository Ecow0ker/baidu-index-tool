[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baidu-index-cross-platform"
version = "2.4.4"
description = "支持 Windows、macOS 图形界面和 Linux 命令行的百度指数查询工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["truststore==0.10.5; sys_platform == 'darwin' or sys_platform == 'win32'"]

[project.optional-dependencies]
desktop = ["pywebview==6.1"]
build = ["pywebview==6.1", "pyinstaller==6.21.0"]

[project.scripts]
baidu-index = "baidu_index_tool.cli:main"
baidu-index-gui = "baidu_index_tool.webview_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
