name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Build and smoke-test EXE
        shell: powershell
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: baidu-index-tool-v2.4.2-windows-x64
          path: dist/baidu-index-tool-v2.4.2-windows-x64.exe
          if-no-files-found: error
